<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#321707">
<title>CoCo Bakery | Grand Opening</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="cover-page">
<main class="invite-shell cover-shell">
  <img class="artwork" src="cover.png" alt="CoCo Bakery grand opening invitation cover">
  <div class="steam-layer" aria-hidden="true">
    <span class="steam steam-one"></span><span class="steam steam-two"></span><span class="steam steam-three"></span>
    <span class="steam steam-four"></span><span class="steam steam-five"></span>
  </div>
  <div class="live-countdown cover-countdown" aria-label="Live countdown to opening">
    <div><strong id="days">--</strong><small>DAYS</small></div>
    <div><strong id="hours">--</strong><small>HOURS</small></div>
    <div><strong id="minutes">--</strong><small>MINUTES</small></div>
    <div><strong id="seconds">--</strong><small>SECONDS</small></div>
  </div>
  <a class="hotspot open-hotspot" href="invitation.html" aria-label="Open invitation"><span>OPEN INVITATION&nbsp; ›</span></a>
</main>
<script src="script.js"></script>
</body>
</html>
